# wrangler.toml - Cloudflare Pages 配置文件

# 项目名称，应与您在 Cloudflare 上创建的项目名匹配
name = "betterdeal"

# Pages专用配置
compatibility_date = "2023-06-28"
compatibility_flags = ["nodejs_compat"]

# 构建输出目录
[site]
bucket = "dist/spa"

# 全局环境变量
[vars]
VITE_API_BASE_URL = "https://betterdeal-worker1.wenmoon124.workers.dev"

# 预览环境配置 (对应原development环境)
[env.preview]
[env.preview.vars]
VITE_API_BASE_URL = "https://betterdeal-worker1.wenmoon124.workers.dev"

# 生产环境配置
[env.production]
[env.production.vars]
VITE_API_BASE_URL = "https://betterdeal-worker1.wenmoon124.workers.dev"